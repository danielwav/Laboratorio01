<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
</head>

<body>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: rgba(255, 255, 255, 0.05);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            max-width: 500px;
        }

        h1 {
            font-size: 2rem;
            color: #4facfe;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.2rem;
            color: #e0e0e0;
            line-height: 1.6;
        }

        .highlight {
            color: #00f2fe;
            font-weight: bold;
        }
    </style>
    </head>

    <body>
        <main class="card">
            <h1>¡Hola! Este es mi primer commit</h1>
            <p>Mi nombre es <span class="highlight">César Augusto Daniel</span>.</p>
        </main>
    </body>

</html>
